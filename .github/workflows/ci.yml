# Quick checks on every push to main and every pull request: lint, unit tests with the coverage gates, and a
# debug build. The full release build runs on the release branch (release.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Lint (detekt + ktlint)
        run: ./gradlew detekt ktlintCheck

      # `check` runs the unit tests and the Kover coverage gates; Android lint waits for the release build.
      - name: Unit tests and coverage
        run: ./gradlew check -x lint

      - name: Debug build
        run: ./gradlew assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: '**/build/reports/tests/'
