# Full build on pushes to the release branch: everything CI checks, plus Android lint, the R8-shrunk release
# build and the screenshot comparison. The APKs are kept as build artifacts (unsigned until signing is set up).
name: Release build

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Lint (detekt + ktlint)
        run: ./gradlew detekt ktlintCheck

      # Unit tests, coverage gates, Android lint, debug and R8-shrunk release builds.
      - name: Full build
        run: ./gradlew build

      # Fails when a screen no longer matches app/screenshots.
      - name: Screenshot comparison
        run: ./gradlew :app:verifyRoborazziDebug

      # Name each screen that changed in an annotation, so it is visible without opening the logs.
      - name: List changed screenshots
        if: failure()
        run: |
          find app/build/outputs/roborazzi -name '*_compare.png' -printf '%f\n' | sort | while read -r f; do
            echo "::error title=Screenshot changed::$f (see the reports artifact for the diff)"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v5
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            **/build/reports/
            app/build/outputs/roborazzi/
