# Full build on the release branch, and published releases from version tags.
#
# - Push to `release`: everything CI checks, plus Android lint, the R8-shrunk release build and the screenshot
#   comparison. APKs are kept as build artifacts.
# - Push a tag `vX.Y.Z` (on the release branch): the same build, signed with the release key from GitHub Secrets,
#   published as a GitHub Release with generated notes. An unsigned APK is never published.
#
# Secrets (Settings → Secrets and variables → Actions):
#   RELEASE_KEYSTORE_BASE64   the .jks file, base64-encoded
#   RELEASE_KEYSTORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD
#   GOOGLE_SERVER_CLIENT_ID   the OAuth Web client id (sign-in does not work without it)
name: Release build

on:
  push:
    branches: [release]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "DRIVESYNC_SIGNING_STOREFILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release signing is set up."
          else
            echo "No signing key in secrets: the release APK stays unsigned."
          fi

      - name: Version from the tag
        if: env.IS_TAG == 'true'
        run: |
          echo "VERSION_ARGS=-PversionName=${GITHUB_REF_NAME#v} -PversionCode=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Lint (detekt + ktlint)
        run: ./gradlew detekt ktlintCheck

      # Unit tests, coverage gates, Android lint, debug and R8-shrunk release builds.
      - name: Full build
        env:
          DRIVESYNC_SIGNING_STOREPASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          DRIVESYNC_SIGNING_KEYALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          DRIVESYNC_SIGNING_KEYPASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          DRIVESYNC_GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: ./gradlew build $VERSION_ARGS

      # Fails when a screen no longer matches app/screenshots.
      - name: Screenshot comparison
        run: ./gradlew :app:verifyRoborazziDebug

      # Name each screen that changed in an annotation, so it is visible without opening the logs.
      - name: List changed screenshots
        if: failure()
        run: |
          find app/build/outputs/roborazzi -name '*_compare.png' -printf '%f\n' | sort | while read -r f; do
            echo "::error title=Screenshot changed::$f (see the reports artifact for the diff)"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk

      - name: Publish the GitHub Release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error title=Not signed::No signed release APK (are the signing secrets set?). Nothing was published."
            exit 1
          fi
          cp "$apk" "drive-sync-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "drive-sync-${GITHUB_REF_NAME}.apk" \
            --title "Drive Sync ${GITHUB_REF_NAME}" --generate-notes

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            app/build/outputs/roborazzi/
