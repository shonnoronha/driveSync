# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
    ignoreDefaultParameters: true
    excludes: ['**/test/**', '**/testFixtures/**']
  TooManyFunctions:
    thresholdInClasses: 16
    excludes: ['**/test/**', '**/testFixtures/**']

style:
  # Early returns are how the executor says "re-check failed, re-plan" (PRD 3.9 rule 4); keep them readable.
  ReturnCount:
    active: false
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    excludes: ['**/test/**', '**/androidTest/**', '**/*.kts']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  MaxLineLength:
    maxLineLength: 120

# ktlint runs via the ktlint-gradle plugin; detekt-formatting is not installed.
